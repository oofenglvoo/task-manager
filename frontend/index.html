<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>任务管理系统</title>
    <script>
      try {
        var prefs = JSON.parse(localStorage.getItem('task-manager:preferences') || '{}')
        var theme = prefs.theme || 'system'
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        if (!dark) root.classList.add('light')
        if (prefs.background) root.classList.add('has-app-bg')
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
